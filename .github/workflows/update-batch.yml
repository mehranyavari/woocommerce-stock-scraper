name: Batch Update by IDs

on:
  workflow_dispatch:
    inputs:
      product_ids:
        description: 'Product IDs (comma separated)'
        required: true
        type: string

jobs:
  scrape-batch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Scraper (Batch Mode)
        # ارسال لیست ID ها به اسکرپر
        run: node scraper.js --ids="${{ inputs.product_ids }}"
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stock-data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Batch Update - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
