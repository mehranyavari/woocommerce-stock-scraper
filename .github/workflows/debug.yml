name: Decathlon Scraper
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: node scraper.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-results
          path: |
            debug_screenshot.png
            debug_source.html
            debug_variable.json
