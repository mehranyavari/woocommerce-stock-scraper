name: LEGO.tr Stok Takip

on:
  # هر روز ساعت 08:00 و 20:00 به وقت ترکیه (UTC+3 = UTC 05:00 و 17:00)
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'

  # دستی هم بتونی اجرا کنی
  workflow_dispatch:
    inputs:
      theme:
        description: 'فقط یه تم خاص (مثلاً star-wars) — خالی = همه'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب وابستگی‌ها
        run: npm install puppeteer-extra puppeteer-extra-plugin-stealth

      - name: اجرای اسکریپت
        run: |
          if [ -n "${{ github.event.inputs.theme }}" ]; then
            node lego-tr-scraper.js --theme "${{ github.event.inputs.theme }}" --out ./output --delay 800
          else
            node lego-tr-scraper.js --out ./output --delay 800
          fi

      - name: آپلود خروجی به Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lego-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: ذخیره JSON در ریپو (commit)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "🧱 stok güncellendi: $(date +'%Y-%m-%d %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
