name: LEGO.tr Stok Takip

on:
  # هر روز ساعت 08:00 و 20:00 به وقت ترکیه (UTC+3 = UTC 05:00 و 17:00)
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'

  # دستی هم بتونی اجرا کنی
  workflow_dispatch:
    inputs:
      theme:
        description: 'فقط یه تم خاص (مثلاً star-wars) — خالی = همه'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب وابستگی‌ها
        run: npm install puppeteer-extra puppeteer-extra-plugin-stealth

      - name: اجرای اسکریپت
        run: |
          if [ -n "${{ github.event.inputs.theme }}" ]; then
            node lego-tr-scraper.js --theme "${{ github.event.inputs.theme }}" --out ./output --delay 800
          else
            node lego-tr-scraper.js --out ./output --delay 800
          fi

      - name: استخراج آمار
        id: stats
        run: |
          if [ -f output/lego-products-full.json ]; then
            total=$(jq 'length' output/lego-products-full.json)
            in_stock=$(jq '[.[] | select(.in_stock == true)] | length' output/lego-products-full.json)
            out_stock=$((total - in_stock))
            avg_price=$(jq '[.[] | .price] | add / length | round' output/lego-products-full.json)
            
            echo "total=$total" >> $GITHUB_OUTPUT
            echo "in_stock=$in_stock" >> $GITHUB_OUTPUT
            echo "out_stock=$out_stock" >> $GITHUB_OUTPUT
            echo "avg_price=$avg_price" >> $GITHUB_OUTPUT
            
            echo "📊 **Özet**" >> $GITHUB_STEP_SUMMARY
            echo "- 🧱 Toplam: **$total** ürün" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Mevcut: **$in_stock** ürün" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ Tükendi: **$out_stock** ürün" >> $GITHUB_STEP_SUMMARY
            echo "- 💰 Ortalama fiyat: **${avg_price} TL**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: آپلود خروجی به Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lego-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: ذخیره JSON در ریپو (commit)
        run: |
          # ساخت فایل آمار
          if [ -f output/lego-products-full.json ]; then
            cat > STATS.md << 'EOF'
# 📊 آمار lego.tr

**آخرین بروزرسانی:** $(date +'%Y-%m-%d %H:%M UTC')

| متریک | مقدار |
|---|---|
| 🧱 کل محصولات | $(jq 'length' output/lego-products-full.json) |
| ✅ موجود | $(jq '[.[] | select(.in_stock == true)] | length' output/lego-products-full.json) |
| ❌ ناموجود | $(jq '[.[] | select(.in_stock == false)] | length' output/lego-products-full.json) |
| 💰 میانگین قیمت | $(jq '[.[] | .price] | add / length | round' output/lego-products-full.json) TL |

---

## پرفروش‌ترین دسته‌بندی‌ها

$(jq -r 'group_by(.category) | map({category: .[0].category, count: length}) | sort_by(-.count) | limit(10; .[]) | "- **\(.category)**: \(.count) محصول"' output/lego-products-full.json)
EOF
          fi
          
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ STATS.md
          git diff --staged --quiet || git commit -m "🧱 stok güncellendi: $(date +'%Y-%m-%d %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
