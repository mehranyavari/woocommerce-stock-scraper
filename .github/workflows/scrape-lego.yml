name: 🧱 LEGO.tr Scraper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'حالت اسکرپ'
        required: true
        default: 'category'
        type: choice
        options:
          - category
          - all
      category_url:
        description: 'URL کتگوری (برای حالت category)'
        required: false
        default: 'https://lego.tr/themes/lego-city'

  schedule:
    - cron: '0 3 * * 6'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🌐 Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: 🧱 اسکرپ کتگوری مشخص
        if: ${{ github.event.inputs.mode == 'category' || github.event_name == 'schedule' }}
        run: |
          URL="${{ github.event.inputs.category_url }}"
          if [ -z "$URL" ]; then
            URL="https://lego.tr/themes/lego-city"
          fi
          node lego-scraper.js --url "$URL" --output ./output
        timeout-minutes: 60

      - name: 🧱 اسکرپ همه کتگوری‌ها
        if: ${{ github.event.inputs.mode == 'all' }}
        run: node lego-scraper.js --all --output ./output
        timeout-minutes: 100

      - name: 📊 نمایش خروجی
        run: |
          echo "=== فایل‌های تولید شده ==="
          ls -lh ./output/ || echo "پوشه output خالی است"

      - name: 📤 آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lego-xml-${{ github.run_number }}
          path: ./output/*.xml
          retention-days: 30

      - name: 💾 Commit فایل XML به ریپو
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          mkdir -p output

          LATEST_XML=$(ls -t ./output/*.xml 2>/dev/null | head -1)
          if [ -n "$LATEST_XML" ]; then
            cp "$LATEST_XML" ./output/lego-latest.xml
            git add output/lego-latest.xml
            git diff --staged --quiet || git commit -m "🧱 LEGO products updated $(date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "فایل XML تولید نشد"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
