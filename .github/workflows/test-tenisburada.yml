name: Test Tenisburada
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install
          npm install puppeteer-real-browser

      - name: Run test
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node test_tenisburada.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenisburada-results
          path: |
            tenisburada_debug.json
