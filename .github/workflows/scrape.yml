name: Scrape Stock Data

on:
  # اجرا هر 6 ساعت یک بار
  schedule:
    - cron: '0 */6 * * *'
  
  # امکان اجرای دستی. only_domain خالی = همان رفتار کامل زمان‌بندی‌شده
  workflow_dispatch:
    inputs:
      only_domain:
        description: 'Only this supplier domain, e.g. spx.com.tr. Leave empty to scrape all products.'
        required: false
        default: ''
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      # Scheduled runs have no inputs; an empty value keeps the full scrape.
      ONLY_DOMAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.only_domain || '' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # ⚠️ نصب پیش‌نیازهای مرورگر واقعی (Xvfb) و پکیج PRB
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install
          npm install puppeteer-real-browser
      
      - name: Run scraper
        run: node scraper.js
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🌟 تغییر مهم مالتی‌سایت: اضافه کردن تمام فایل‌هایی که با stock-data شروع می‌شوند
          git add stock-data*.json
          
          # کامیت کردن فایل‌ها در صورت وجود تغییرات
          if [ -n "$ONLY_DOMAIN" ]; then
            COMMIT_MSG="🔄 Update stock data for ${ONLY_DOMAIN} - $(date '+%Y-%m-%d %H:%M:%S')"
          else
            COMMIT_MSG="🔄 Update stock data for all sites - $(date '+%Y-%m-%d %H:%M:%S')"
          fi
          git diff --quiet && git diff --staged --quiet || git commit -m "$COMMIT_MSG"
          
          # پوش کردن به مخزن
          git pull --rebase --autostash origin main
          git push
