name: Scrape Stock Data

on:
  # اجرا هر 6 ساعت یک بار
  schedule:
    - cron: '0 */6 * * *'
  
  # امکان اجرای دستی
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # ⚠️ نصب پیش‌نیازهای مرورگر واقعی (Xvfb) و پکیج PRB
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install
          npm install puppeteer-real-browser
      
      - name: Run scraper
        run: node scraper.js
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🌟 تغییر مهم مالتی‌سایت: اضافه کردن تمام فایل‌هایی که با stock-data شروع می‌شوند
          git add stock-data*.json
          
          # کامیت کردن فایل‌ها در صورت وجود تغییرات
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Update stock data for all sites - $(date '+%Y-%m-%d %H:%M:%S')"
          
          # پوش کردن به مخزن
          git pull --rebase --autostash origin main
          git push
