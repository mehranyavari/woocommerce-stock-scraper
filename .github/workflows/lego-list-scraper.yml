name: LEGO List Scraper

on:
  workflow_dispatch:
    inputs:
      no_images:
        description: 'فقط XML (بدون دانلود تصویر)'
        required: false
        default: false
        type: boolean
      delay_ms:
        description: 'تاخیر بین محصولات (ms)'
        required: false
        default: '1500'
      resume:
        description: 'ادامه از checkpoint قبلی'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 3 * * *'

  push:
    paths:
      - 'urls.txt'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium + zip dependencies
        run: |
          sudo apt-get update -qq
          # Ubuntu 24 (noble) نام پکیج‌ها رو عوض کرده — t64 suffix اضافه شده
          sudo apt-get install -y \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            zip \
            --no-install-recommends

      - name: Download previous output (for resume)
        if: ${{ inputs.resume == true }}
        uses: actions/download-artifact@v4
        with:
          name: lego-output
          path: output/
        continue-on-error: true

      - name: Run scraper
        run: |
          FLAGS="--list urls.txt --output ./output --delay ${{ inputs.delay_ms || '1500' }}"
          if ${{ inputs.no_images }}; then FLAGS="$FLAGS --no-images"; fi
          if ${{ inputs.resume }};   then FLAGS="$FLAGS --resume";    fi
          node lego-list-scraper.js $FLAGS
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload XML + JSON output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lego-output
          path: |
            output/lego-list-latest.xml
            output/lego-list-latest.json
          retention-days: 30

      - name: Upload images ZIP
        uses: actions/upload-artifact@v4
        if: ${{ inputs.no_images == false }}
        with:
          name: lego-images
          path: output/lego-images.zip
          retention-days: 7
        continue-on-error: true
