name: Debug Decathlon Puppeteer

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: |
          npm install puppeteer-extra puppeteer-extra-plugin-stealth
          npm install puppeteer

      - name: Test Turkey Proxy
        run: |
          curl -v --proxy http://mehran:mehran75@45.145.20.148:3128 https://ipinfo.io

      - name: Run Puppeteer Script
        run: node decathlon_debug_puppeteer.js

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puppeteer-debug-results
          path: |
            *.png
            *.html
            *.json
