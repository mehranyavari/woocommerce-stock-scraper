name: 🧱 LEGO — دریافت محصول تکی

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: 'لینک محصول lego.tr'
        required: true
        type: string

jobs:
  scrape:
    name: دریافت و تبدیل به XML + ZIP تصاویر
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب وابستگی‌ها
        run: npm install

      - name: نصب Chromium برای Puppeteer
        run: npx puppeteer browsers install chrome

      - name: نصب zip
        run: sudo apt-get install -y zip

      - name: اجرای اسکریپت
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          OUTPUT_DIR: ./output
        run: node lego-single.js "${{ inputs.product_url }}"

      - name: آپلود XML
        uses: actions/upload-artifact@v4
        with:
          name: lego-product-xml
          path: output/*.xml
          retention-days: 30
          if-no-files-found: error

      - name: آپلود ZIP تصاویر
        uses: actions/upload-artifact@v4
        with:
          name: lego-product-images
          path: output/*-images.zip
          retention-days: 30
          if-no-files-found: warn
